name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # The same canonical pre-PR gate contributors run locally
      # (typecheck + test + lint + check:filenames + build), rather than a
      # second hand-maintained list of the individual steps that can drift
      # out of sync with it. See CONTRIBUTING.md, "npm scripts".
      - run: npm run check
