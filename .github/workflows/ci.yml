name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # The same canonical pre-PR gate contributors run locally
      # (build + typecheck + test + lint + check:filenames), rather than a
      # second hand-maintained list of the individual steps that can drift
      # out of sync with it. See CONTRIBUTING.md, "npm scripts".
      - run: npm run check

  # The extension E2E suite is its own job rather than part of `npm run check`:
  # it needs a real Chromium, which the unit-test gate must not require. One
  # Node version is enough — what it exercises is the browser, not Node.
  # See CONTRIBUTING.md, "Extension E2E tests".
  extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The E2E suite loads `apps/extension/dist`, so it has to exist.
      - run: npm run build
      - run: npm run test:e2e

  # The Firefox lane is separate from the Chrome one because it needs a
  # different browser and a different runner (WebDriver BiDi, not Playwright
  # — Playwright cannot load a Firefox extension). Firefox comes from the
  # runner image rather than being pinned: this lane currently asserts only
  # that the production build installs and runs, and the version floor that
  # matters is enforced by the manifest's own `strict_min_version`.
  # See docs/architecture.md, "Browser automation: where this is going".
  extension-e2e-firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-firefox@v1
      # The E2E suite installs `apps/extension/dist-firefox`, so it has to exist.
      - run: npm run build
      - run: npm run test:e2e:firefox
