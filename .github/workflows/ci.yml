name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # The same canonical pre-PR gate contributors run locally
      # (build + typecheck + test + lint + check:filenames), rather than a
      # second hand-maintained list of the individual steps that can drift
      # out of sync with it. See CONTRIBUTING.md, "npm scripts".
      - run: npm run check

  # The extension E2E suite is its own job rather than part of `npm run check`:
  # it needs a real Chromium, which the unit-test gate must not require. One
  # Node version is enough — what it exercises is the browser, not Node.
  # See CONTRIBUTING.md, "Extension E2E tests".
  extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The E2E suite loads `apps/extension/dist`, so it has to exist.
      - run: npm run build
      - run: npm run test:e2e

  # The Firefox lane is separate from the Chrome one because it needs a
  # different browser and a different runner (WebDriver BiDi, not Playwright
  # — Playwright cannot load a Firefox extension). Firefox is pinned here,
  # not taken from the runner image: measured, Firefox 155 added a second
  # WebDriver BiDi restriction beyond the `--remote-allow-system-access` gate
  # this harness already works around (bidi-session.ts) — `input.performActions`
  # unconditionally refuses a `moz-extension:` browsing context ("privileged
  # scope"), which is what this suite needs to exercise `permissions.request()`
  # from a genuine gesture. That refusal is a hardcoded per-command allowlist
  # in Firefox's own source (`supportsPrivilegedScope`, opted into only by the
  # BiDi `browsingContext` and `script` modules), not a capability any client
  # can request — 154.0.1 is the newest release measured to still allow it.
  # See docs/architecture.md, "Browser automation: where this is going".
  #
  # Runs under Xvfb, headed (`FIREFOX_HEADED=1`): measured on Firefox 154.0.1,
  # headless Firefox on Linux cannot show the native save-file chooser at all
  # — `downloads.download({ saveAs: true })` rejects immediately with "An
  # unexpected error occurred" instead of parking on it, which is exactly the
  # state the two save-command tests assert on. Headed Firefox under a real
  # (virtual) X display does not have this problem; see bidi-session.ts's
  # module doc for the measurement.
  extension-e2e-firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: '154.0.1'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      # The E2E suite installs `apps/extension/dist-firefox`, so it has to exist.
      - run: npm run build
      - run: xvfb-run -a npm run test:e2e:firefox
        env:
          FIREFOX_HEADED: '1'

  # A canary, not a gate: runs the identical suite against whatever Firefox
  # is currently "latest", so a future WebDriver BiDi restriction (like the
  # two the pinned lane above already works around or is blocked by) shows up
  # promptly instead of silently at the next manual investigation. Never
  # blocks a merge — `continue-on-error` — because "latest" moving out from
  # under this suite is expected, not a defect in this PR.
  extension-e2e-firefox-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-firefox@v1
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm run build
      # Headed under Xvfb, same as the required lane above (see its comment)
      # — otherwise this canary would fail at the save-command tests for the
      # headless-on-Linux reason, masking whatever it's actually meant to
      # catch: the next WebDriver BiDi restriction on a future Firefox.
      - run: xvfb-run -a npm run test:e2e:firefox
        env:
          FIREFOX_HEADED: '1'
