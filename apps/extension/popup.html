<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>ArchiveBridge</title>
		<style>
			html {
				color-scheme: light dark;
			}
			body {
				width: 280px;
				margin: 0;
				padding: 4px;
				font: 14px system-ui, sans-serif;
				color: canvastext;
				background: canvas;
			}
			button {
				display: flex;
				align-items: center;
				width: 100%;
				height: 40px;
				box-sizing: border-box;
				padding: 0 12px;
				margin: 0;
				font: inherit;
				text-align: left;
				border: none;
				border-radius: 6px;
				background: transparent;
				color: inherit;
				cursor: pointer;
			}
			button:hover:enabled {
				background: color-mix(in srgb, canvastext 8%, transparent);
			}
			button:active:enabled {
				background: color-mix(in srgb, canvastext 14%, transparent);
			}
			button:focus-visible {
				outline: 2px solid Highlight;
				outline-offset: -2px;
			}
			button:disabled {
				cursor: default;
				opacity: 0.5;
			}
			#status {
				margin: 0;
				font-size: 12px;
				color: color-mix(in srgb, canvastext 65%, transparent);
				overflow-wrap: anywhere;
			}
			#status:empty {
				display: none;
			}
			#status:not(:empty) {
				margin: 4px 12px 0;
			}
			#status.error {
				color: #b3261e;
			}
			#file-access {
				margin: 4px 12px 0;
				padding-top: 6px;
				border-top: 1px solid color-mix(in srgb, canvastext 12%, transparent);
				font-size: 11px;
				line-height: 1.4;
				color: color-mix(in srgb, canvastext 65%, transparent);
			}
		</style>
	</head>
	<body>
		<button id="save-mhtml" type="button">Save as MHTML&hellip;</button>
		<button id="save-webarchive" type="button">Save as WebArchive&hellip;</button>
		<p id="status"></p>
		<p id="file-access" hidden></p>
		<script type="module" src="popup.js"></script>
	</body>
</html>
