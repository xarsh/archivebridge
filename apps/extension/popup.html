<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>ArchiveBridge</title>
		<style>
			body {
				width: 224px;
				margin: 0;
				padding: 8px;
				font: 13px system-ui, sans-serif;
				color: canvastext;
				background: canvas;
			}
			button {
				display: block;
				width: 100%;
				padding: 8px 10px;
				margin: 0 0 6px;
				font: inherit;
				text-align: left;
				border: 1px solid color-mix(in srgb, canvastext 25%, transparent);
				border-radius: 6px;
				background: color-mix(in srgb, canvastext 5%, transparent);
				color: inherit;
				cursor: pointer;
			}
			button:hover:enabled {
				background: color-mix(in srgb, canvastext 12%, transparent);
			}
			button:disabled {
				cursor: default;
				opacity: 0.5;
			}
			#status {
				margin: 0;
				min-height: 1.4em;
				font-size: 12px;
				color: color-mix(in srgb, canvastext 65%, transparent);
				overflow-wrap: anywhere;
			}
			#status.error {
				color: #b3261e;
			}
			#file-access {
				margin: 6px 0 0;
				padding-top: 6px;
				border-top: 1px solid color-mix(in srgb, canvastext 18%, transparent);
				font-size: 11px;
				line-height: 1.4;
				color: color-mix(in srgb, canvastext 65%, transparent);
			}
		</style>
	</head>
	<body>
		<button id="save-mhtml" type="button">Save as MHTML&hellip;</button>
		<button id="save-webarchive" type="button">Save as WebArchive&hellip;</button>
		<p id="status"></p>
		<p id="file-access" hidden></p>
		<script type="module" src="popup.js"></script>
	</body>
</html>
